flip:`<div class="row"><button class="b${V.flipX?' on':''}" onclick="flp('flipX')">انعكاس أفقي</button><button class="b${V.flipY?' on':''}" onclick="flp('flipY')">قلب رأسي</button></div>`,
key:`<p class="h">اضغط على لون الخلفية داخل الفيديو لإزالته. بيشتغل أحسن مع خلفية بلون واحد.</p>`+rg('الحساسية',V.tol,10,200,'V.tol=+this.value')+`<div class="row"><label>الخلفية الجديدة</label><input type="color" value="${V.bg}" oninput="V.bg=this.value"><button class="b" onclick="snap();V.key=null">إلغاء القص</button></div>`,
music:`<div class="row"><button class="b" onclick="$('#fa').click()">+ إضافة موسيقى</button><button class="b" onclick="rmMus()">حذف</button></div>`+rg('الصوت',MV,0,1,'MV=+this.value;au.volume=MV',.05),
over:`<div class="row"><button class="b" onclick="$('#fi').click()">+ إضافة صورة</button><button class="b" onclick="rmImg()">حذف</button></div>`+(IMG?rg('الحجم',OV.w,5,100,'OV.w=+this.value')+rg('أفقي',OV.x,0,100,'OV.x=+this.value')+rg('رأسي',OV.y,0,100,'OV.y=+this.value')+rg('الشفافية',OV.op,10,100,'OV.op=+this.value'):'')}}
function setX(k){snap();V.fx=k;openT=null;sheet('fx')}
function setM(k){snap();V.mask=k;openT=null;sheet('mask')}
function rot(d){snap();V.rot=d?(V.rot+d+360)%360:0}
function flp(k){snap();V[k]=V[k]?0:1;openT=null;sheet('flip')}
function rmMus(){MUF=null;au.pause();au.removeAttribute('src');AU=false;rt()}
function rmImg(){snap();IMG=null;IMF=null;openT=null;rt();sheet('over')}
$('#fa').onchange=e=>{const f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);MUF=f;AU=true;AN=f.name;au.volume=MV;au.onloadedmetadata=rt;rt()};
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;snap();IMF=f;IMG=new Image();IMG.src=URL.createObjectURL(f);OV={x:50,y:50,w:30,op:100};IMG.onload=()=>{rt();openT=null;sheet('over')}};
$('#addm').onclick=()=>sheet('music');$('#addi').onclick=()=>sheet('over');$('#addvol').onclick=()=>sheet('vol');
pc.onclick=e=>{if(openT=='key'){const r=pc.getBoundingClientRect();snap();V.pick=[Math.floor((e.clientX-r.left)/r.width*pc.width),Math.floor((e.clientY-r.top)/r.height*pc.height)]}};
v.addEventListener('play',()=>{if(AU){au.currentTime=Math.min(ttNow(),au.duration||1e9);au.volume=MV;au.play().catch(()=>{})}});v.addEventListener('pause',()=>au.pause());
function extra(){const W=TD*pps;$('#rmu').innerHTML=AU?`<div class="tc f" style="width:${Math.min(au.duration||TD,TD)*pps}px">♪ ${esc(AN)}</div>`:`<div class="tc" style="width:${W}px">اضغط لإضافة موسيقى</div>`;$('#ri').innerHTML=`<div class="tc${IMG?' f':''}" style="width:${W}px">${IMG?'🖼 صورة':'اضغط لإضافة صورة / تركيب'}</div>`;$('#ra').innerHTML=segs.map((g,i)=>{const d=g.e-g.s,bp=d>=dur-.01?0:g.s/(dur-d)*100;return `<div class="sg ag${i==sel?' on':''}" data-n="${i}" style="left:${st[i]*pps}px;width:${d/g.sp*pps}px;background-size:${dur/d*100}% 100%;background-position:${bp}% 0"></div>`}).join('')}
async function mkWave(f){$('#ra').style.removeProperty('--wave');if(f.size>9e7)return;try{const a=new AudioContext(),bf=await a.decodeAudioData(await f.arrayBuffer()),d=bf.getChannelData(0),n=Math.min(1200,Math.ceil(bf.duration*20)),c=document.createElement('canvas');c.width=n*3;c.height=60;const g=c.getContext('2d');g.fillStyle='#e879f9';const bl=Math.floor(d.length/n);for(let i=0;i<n;i++){let m=0;for(let j=0;j<bl;j+=40){const z=Math.abs(d[i*bl+j]);if(z>m)m=z}const h=Math.max(2,m*58);g.fillRect(i*3,30-h/2,2,h)}$('#ra').style.setProperty('--wave','url('+c.toDataURL()+')');a.close()}catch(e){}}
Object.assign(NM,{curve:'منحنى السرعة',kf:'الإطار المفتاحي'});
let KF=[],REPL=false,PID=null,FILE=null,IMF=null,MUF=null,PEND=null,SV={},lastS='',NAME='',dq=null,ct;
const CVN={acc:'تسارع',dec:'تباطؤ',pulse:'نبضة'},CVP={acc:[.4,.6,.9,1.4,2,3],dec:[3,2,1.4,.9,.6,.4],pulse:[2,1,.5,.5,1,2]};
function curve(k){const g=segs[sel];if(g.lock)return toast('المقطع مقفول 🔒');snap();const P=CVP[k],d=(g.e-g.s)/P.length;segs.splice(sel,1,...P.map((m,i)=>({...g,s:g.s+i*d,e:g.s+(i+1)*d,sp:+(g.sp*m).toFixed(2)})));anim=true;render()}
function dup(){snap();const g=segs[sel];segs.splice(sel+1,0,{...g,lock:false});sel++;anim=true;render()}
function lck(){snap();const g=segs[sel];g.lock=!g.lock;rt()}
function repl(){REPL=true;$('#f').click()}
function kfAt(t){const a=KF;if(!a.length)return[1,0,0];if(t<=a[0].t)return[a[0].z,a[0].x,a[0].y];for(let i=1;i<a.length;i++)if(t<=a[i].t){const p=a[i-1],q=a[i],u=(t-p.t)/(q.t-p.t||1);return[p.z+(q.z-p.z)*u,p.x+(q.x-p.x)*u,p.y+(q.y-p.y)*u]}const l=a[a.length-1];return[l.z,l.x,l.y]}
function kfSet(i,val){const t=ttNow();let k=KF.find(a=>Math.abs(a.t-t)<.15);if(!k){const c=kfAt(t);k={t,z:c[0],x:c[1],y:c[2]};KF.push(k);KF.sort((a,b)=>a.t-b.t)}k['zxy'[i]]=val}
function kfUI(){const k=kfAt(ttNow());return `<p class="h">حرّك المؤشر لأي نقطة وعدّل القيم، وبيتسجل إطار مفتاحي والحركة بين الإطارات تلقائية. (${KF.length} إطار)</p>`+rg('زووم',Math.round(k[0]*100),50,300,'kfSet(0,this.value/100)')+rg('أفقي',Math.round(k[1]),-50,50,'kfSet(1,+this.value)')+rg('رأسي',Math.round(k[2]),-50,50,'kfSet(2,+this.value)')+`<div class="row"><button class="b" onclick="snap();KF=[];openT=null;sheet('kf')">مسح الإطارات</button></div>`}
const CBT=[['swap','استبدال','repl()'],['kf','إطار مفتاحي',"sheet('kf')"],['curve','منحنى',"sheet('curve')"],['lock','قفل','lck()'],['dup','تكرار','dup()'],['trash','حذف','del()']];
function cbr(){const g=segs[sel]||{};$('#cb').innerHTML=CBT.map(a=>`<button class="${a[0]=='lock'&&g.lock?'on':''}" onclick="${a[2]};showC()">${svg(a[0],20)}<span>${a[0]=='lock'&&g.lock?'مقفول':a[1]}</span></button>`).join('')}
function showC(){if(!dur)return;cbr();$('#cb').classList.add('show');clearTimeout(ct);ct=setTimeout(hideC,6000)}
function hideC(){$('#cb').classList.remove('show')}
$('#adj').onclick=()=>{$('#tools').classList.contains('show')?hideT():showT()};
document.querySelector('.lg').onclick=async()=>{await save();location.reload()};
$('#hn').onclick=pick;
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('movecut',1);r.onupgradeneeded=()=>{r.result.createObjectStore('p',{keyPath:'id'});r.result.createObjectStore('b',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no()}catch(e){no()}});DB.catch(()=>{});
const dbx=async(s,m,a)=>{const d=await DB;return new Promise((ok,no)=>{const q=d.transaction(s,m=='get'||m=='getAll'?'readonly':'readwrite').objectStore(s)[m](a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no()})};
const stt=()=>({segs,fk,T,V,OV,KF,RT,pps});
async function save(){if(!dur||!FILE||!PID||exporting)return;const s=JSON.stringify(stt()),bl={v:FILE,i:IMG?IMF:null,m:AU?MUF:null};let ch=s!==lastS;for(const k in bl)if(bl[k]!==SV[k])ch=true;if(!ch)return;try{for(const k in bl)if(bl[k]!==SV[k]){bl[k]?await dbx('b','put',{id:PID+k,b:bl[k]}):await dbx('b','delete',PID+k);SV[k]=bl[k]}const c=document.createElement('canvas');c.width=120;c.height=Math.round(120*pc.height/pc.width)||120;c.getContext('2d').drawImage(pc,0,0,c.width,c.height);await dbx('p','put',{id:PID,name:NAME,date:Date.now(),thumb:c.toDataURL('image/jpeg',.6),dur:TD,st:stt(),mn:AN});lastS=s}catch(e){}}
setInterval(save,4000);
async function home(){let L=[];try{L=await dbx('p','getAll')}catch(e){}L.sort((a,b)=>b.date-a.date);$('#hl').innerHTML=L.length?L.map(p=>`<div class="pc" onclick="openP(${p.id})"><div class="th" style="background-image:url(${p.thumb||''})"></div><b>${esc(p.name)}</b><small>${p.dur?p.dur.toFixed(1)+' ث · ':''}${new Date(p.date).toLocaleDateString('ar-EG')}</small><button class="x" onclick="event.stopPropagation();delP(${p.id})">✕</button></div>`).join(''):'<p class="h">مفيش مشاريع محفوظة لسه. ابدأ مشروع جديد.</p>'}
async function delP(id){if(dq!==id){dq=id;toast('اضغط ✕ مرة تانية للحذف');setTimeout(()=>dq=null,3000);return}dq=null;try{await dbx('p','delete',id);for(const k of 'vim')await dbx('b','delete',id+k)}catch(e){}home()}
async function openP(id){try{const m=await dbx('p','get',id),b=await dbx('b','get',id+'v');if(!m||!b)return toast('المشروع غير موجود');const i=await dbx('b','get',id+'i'),a=await dbx('b','get',id+'m');PID=id;NAME=m.name;FILE=b.b;IMF=i&&i.b||null;MUF=a&&a.b||null;SV={v:FILE,i:IMF,m:MUF};lastS='';if(IMF){IMG=new Image();IMG.src=URL.createObjectURL(IMF)}if(MUF){au.src=URL.createObjectURL(MUF);AU=true;AN=m.mn||'موسيقى'}PEND=m.st;v.src=URL.createObjectURL(FILE);mkWave(FILE)}catch(e){toast('تعذر فتح المشروع')}}
home();
tb();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
